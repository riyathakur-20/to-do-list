
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>My Day ✨</h1>
        <p class="subtitle">Make today count, one task at a time.</p>

        <div class="progress-card">
            <h2>Today's Progress</h2>
            <p>Keep going! You're doing great 💜</p>
            
            
        </div>

        <div class="task-card">
            <h2>My Tasks 📝</h2>

            <div class="task">
                <input type="checkbox" id="task1" checked>
                <label for="task1">Complete HTML practice</label>
            </div>

            <div class="task">
                <input type="checkbox" id="task2">
                <label for="task2">Learn CSS Flexbox</label>
            </div>

            <div class="task">
                <input type="checkbox" id="task3">
                <label for="task3">Work on my portfolio</label>
            </div>

            <div class="task">
                <input type="checkbox" id="task4">
                <label for="task4">Read for 20 minutes</label>
            </div>

        </div>

        <p class="footer">Small steps lead to big things 🌷</p>

    </div>

</body>
</html>
